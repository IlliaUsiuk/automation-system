<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: oklch(98% 0.008 75);
      --surface: oklch(100% 0 0);
      --surface-alt: oklch(96% 0.01 75);
      --border: oklch(90% 0.012 75);
      --text: oklch(22% 0.015 75);
      --text-muted: oklch(48% 0.02 75);
      --accent: oklch(62% 0.11 55);
      --accent-ink: oklch(32% 0.07 55);
      --accent-soft: oklch(94% 0.03 55);
      --green: oklch(58% 0.11 148);
      --green-soft: oklch(94% 0.03 148);
      --amber: oklch(66% 0.14 75);
      --amber-soft: oklch(95% 0.035 75);
      --red: oklch(56% 0.16 25);
      --red-soft: oklch(95% 0.03 25);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; color: var(--text); }
    a { color: var(--accent-ink); text-decoration: none; }
    a:hover { color: var(--accent); }
    .sora { font-family: 'Sora', 'IBM Plex Sans', system-ui, sans-serif; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; cursor: pointer;
      transition: box-shadow .15s ease, border-color .15s ease;
    }
    .card:hover { box-shadow: 0 6px 20px oklch(22% 0.02 75 / 8%); border-color: oklch(85% 0.015 75); }
  </style>
</helmet>
<div style="width: 1320px; height: 900px; display: flex; background: var(--bg); font-family: 'IBM Plex Sans', system-ui, sans-serif;">
  <dc-import name="Sidebar" active="registry" hint-size="240px,900px"></dc-import>

  <div style="flex: 1; padding: 32px 36px; display: flex; flex-direction: column; gap: 22px; overflow: hidden;">
    <div>
      <div class="sora" style="font-size: 21px; font-weight: 600;">Automation Registry</div>
      <div style="font-size: 13.5px; color: var(--text-muted); margin-top: 4px;">
        Every automation running at Supplax — what it does, who owns it, and what it's worth.
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="flex: 1; max-width: 320px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <span style="font-size: 13px; color: var(--text-muted);">Search automations…</span>
      </div>
      <div style="width: 1px; height: 22px; background: var(--border);"></div>
      <sc-for list="{{categories}}" as="cat" hint-placeholder-count="6">
        <div style="{{cat.style}} padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 500; white-space: nowrap;">
          {{cat.label}}
        </div>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; overflow: hidden;">
      <sc-for list="{{automations}}" as="a" hint-placeholder-count="9">
        <div class="card">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div style="{{a.tagStyle}} padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600;">{{a.category}}</div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <span style="{{a.dotStyle}} width: 7px; height: 7px; border-radius: 50%; display: inline-block;"></span>
              <span style="font-size: 11.5px; color: var(--text-muted);">{{a.statusLabel}}</span>
            </div>
          </div>

          <div>
            <div class="sora" style="font-size: 15px; font-weight: 600;">{{a.name}}</div>
            <div style="font-size: 12.5px; color: var(--text-muted); margin-top: 4px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{a.description}}</div>
          </div>

          <div style="height: 1px; background: var(--border);"></div>

          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 6px; color: var(--accent-ink); font-size: 12.5px; font-weight: 600;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="8.2"/><path d="M12 7.3v5l3.3 1.9"/>
              </svg>
              {{a.roi}}
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <div style="width: 20px; height: 20px; border-radius: 50%; background: var(--surface-alt); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 600; color: var(--text-muted);">{{a.ownerInitials}}</div>
              <span style="font-size: 12px; color: var(--text-muted);">{{a.owner}}</span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  categoryStyle(hue) {
    return `background: oklch(93% 0.03 ${hue}); color: oklch(35% 0.09 ${hue});`;
  }
  statusMeta(status) {
    if (status === 'healthy') return { label: 'Healthy', dot: 'background: var(--green);' };
    if (status === 'degraded') return { label: 'Degraded', dot: 'background: var(--amber);' };
    return { label: 'Broken', dot: 'background: var(--red);' };
  }
  renderVals() {
    const cats = [
      { label: 'All', hue: null },
      { label: 'Finance Ops', hue: 195 },
      { label: 'Sales & CRM', hue: 275 },
      { label: 'Support', hue: 15 },
      { label: 'Reporting', hue: 55 },
      { label: 'HR', hue: 148 },
    ];
    const categories = cats.map((c, i) => ({
      label: c.label,
      style: i === 0
        ? 'background: var(--accent-ink); color: white;'
        : this.categoryStyle(c.hue),
    }));

    const raw = [
      { name: 'Invoice Reconciliation', category: 'Finance Ops', hue: 195, status: 'healthy', owner: 'Marta K.', ownerInitials: 'MK', roi: '≈16h / mo saved', description: 'Matches incoming vendor invoices against PO records and flags mismatches in ClickUp.' },
      { name: 'Lead Enrichment Pipeline', category: 'Sales & CRM', hue: 275, status: 'healthy', owner: 'Dylan R.', ownerInitials: 'DR', roi: '≈9h / mo saved', description: 'Enriches new CRM leads with firmographic data before they reach a rep’s queue.' },
      { name: 'Support Ticket Triage', category: 'Support', hue: 15, status: 'degraded', owner: 'Ivy N.', ownerInitials: 'IN', roi: '≈22h / mo saved', description: 'Classifies and routes incoming support tickets by urgency and product area.' },
      { name: 'Weekly Exec Report', category: 'Reporting', hue: 55, status: 'healthy', owner: 'Marta K.', ownerInitials: 'MK', roi: '≈$480 / mo saved', description: 'Compiles KPIs from four internal tools into one weekly leadership summary.' },
      { name: 'Onboarding Paperwork Bot', category: 'HR', hue: 148, status: 'healthy', owner: 'Sofia T.', ownerInitials: 'ST', roi: '≈5h / mo saved', description: 'Generates and sends new-hire paperwork the day an offer is accepted.' },
      { name: 'ClickUp → Slack Digest', category: 'Reporting', hue: 55, status: 'broken', owner: 'Dylan R.', ownerInitials: 'DR', roi: '≈4h / mo saved', description: 'Posts a daily digest of overdue ClickUp tasks to the relevant Slack channel.' },
      { name: 'Contract Renewal Alerts', category: 'Sales & CRM', hue: 275, status: 'healthy', owner: 'Ivy N.', ownerInitials: 'IN', roi: '≈$210 / mo saved', description: 'Flags contracts approaching renewal 45 days out and notifies the account owner.' },
      { name: 'Expense Receipt Sorter', category: 'Finance Ops', hue: 195, status: 'healthy', owner: 'Sofia T.', ownerInitials: 'ST', roi: '≈7h / mo saved', description: 'Sorts forwarded receipt emails by cost center and attaches them to expense reports.' },
      { name: 'Candidate Screener', category: 'HR', hue: 148, status: 'degraded', owner: 'Marta K.', ownerInitials: 'MK', roi: '≈11h / mo saved', description: 'Pre-screens inbound applications against role requirements before recruiter review.' },
    ];
    const automations = raw.map((a) => {
      const meta = this.statusMeta(a.status);
      return {
        ...a,
        tagStyle: this.categoryStyle(a.hue),
        dotStyle: meta.dot,
        statusLabel: meta.label,
      };
    });

    return { categories, automations };
  }
}
</script>
</x-dc>
</body>
</html>
